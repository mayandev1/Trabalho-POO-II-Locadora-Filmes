# Banco de dados PostgreSQL e API Flask da locadora, cada um em um conteiner
# Para subir - docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: locadora_db
    environment:
      POSTGRES_DB: locadora
      POSTGRES_USER: locadora
      POSTGRES_PASSWORD: locadora123
    volumes:
      - dados_locadora:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: locadora_api
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  dados_locadora:
